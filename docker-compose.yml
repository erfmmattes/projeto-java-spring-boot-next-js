services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: clinic
      MYSQL_USER: clinic
      MYSQL_PASSWORD: clinic
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clinic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: clinic
      SPRING_DATASOURCE_PASSWORD: clinic
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
  frontend:
    build:
      context: .
      args:
        BACKEND_URL: http://backend:8080
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  mysql_data:

